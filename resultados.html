<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados — MISS UESP 2027</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#302329}header{padding:18px;border-bottom:5px solid #c8102e}h1,h2{color:#c8102e}main{max-width:1200px;margin:20px auto;padding:0 12px}.card{border:1px solid #e5b7be;border-radius:12px;padding:15px;margin-bottom:14px}select,button{padding:10px;border:1px solid #c8102e;border-radius:8px;color:#a50d25;background:white;font-weight:700;cursor:pointer}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#c8102e;color:white}td,th{padding:9px;border-bottom:1px solid #e5b7be;text-align:left}.note{font-size:13px;color:#5b4a4d}.summary{display:flex;gap:14px;flex-wrap:wrap}.summary b{color:#c8102e;font-size:22px}</style></head><body><header><h1>Resultados — MISS UESP • CARNAVAL 2027</h1><div>Central de apuração • Audição e Concurso</div></header><main><section class="card"><label for="stage"><b>Etapa dos resultados:</b></label> <select id="stage"><option value="AUDICAO">AUDIÇÃO</option><option value="CONCURSO">CONCURSO</option></select> <button id="refresh">Atualizar resultados</button> <button id="report">Imprimir / Salvar PDF</button><p id="status" class="note">Carregando…</p><div class="summary" id="summary"></div></section><section class="card"><h2 id="heading">Classificação</h2><div class="wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div><p class="note" id="explain"></p></section><section class="card" id="tie" style="display:none"><h2>Critérios de desempate do Concurso</h2><label><input type="checkbox" id="sambaTie" checked> Prioridade 1 — Samba no Pé</label><br><label><input type="checkbox" id="commTie" checked> Prioridade 2 — Comunicação + Elegância</label><p class="note">As opções ordenam os critérios de desempate na tela. Os dados registrados não são alterados.</p></section></main><script>
const $=id=>document.getElementById(id);const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v==null||v===''?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
async function api(path){const r=await fetch(path,{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Erro API');return j}
async function load(){const stage=$('stage').value;$('status').textContent='Consultando etapa '+stage+'…';$('tie').style.display=stage==='CONCURSO'?'block':'none';try{if(stage==='AUDICAO'){const [cr,ar,sr]=await Promise.all([api('/api/candidates'),api('/api/arrivals'),api('/api/scores')]);const arrivals=ar.arrivals||{},scores=sr.scores||{};let rows=(cr.candidates||[]).filter(c=>arrivals[String(c.id)]&&String(arrivals[String(c.id)].status||'PRESENTE')==='PRESENTE').map(c=>{const ev=Object.values(scores[String(c.id)]||{}).filter(s=>s&&s.communication!=null&&s.samba!=null);return {...c,count:ev.length,total:ev.reduce((n,s)=>n+Number(s.communication)+Number(s.samba),0),samba:ev.reduce((n,s)=>n+Number(s.samba),0)}});const cat=$('category')?.value||'';rows.sort((a,b)=>norm(a.category).localeCompare(norm(b.category))||b.total-a.total||b.samba-a.samba||a.name.localeCompare(b.name));$('thead').innerHTML='<tr><th>Categoria</th><th>Candidata(o)</th><th>Avaliações completas</th><th>Total acumulado</th><th>Samba (desempate)</th><th>Status</th></tr>';$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.count}/5</td><td>${x.count?fmt(x.total):'—'}</td><td>${x.count?fmt(x.samba):'—'}</td><td>${x.count>=5?'Completa':x.count?'Parcial':'Aguardando notas'}</td></tr>`).join('')||'<tr><td colspan="6">Sem participantes presentes.</td></tr>';$('summary').innerHTML=`<div>Candidatos presentes <b>${rows.length}</b></div><div>Apurações completas <b>${rows.filter(x=>x.count>=5).length}</b></div><div>Parciais <b>${rows.filter(x=>x.count>0&&x.count<5).length}</b></div>`;$('explain').textContent='Audição: a pontuação soma Comunicação e Samba por avaliador com os dois critérios válidos. Classificação e notas da etapa Concurso são mantidas separadamente.';}else{const j=await api('/api/contest-results');let rows=j.results||[];const order=[];if($('sambaTie').checked)order.push('samba');if($('commTie').checked)order.push('communication_elegance');rows.sort((a,b)=>norm(a.category).localeCompare(norm(b.category))||Number(b.total??-1)-Number(a.total??-1)||order.reduce((d,k)=>d||(Number(b[k]??-1)-Number(a[k]??-1)),0)||a.name.localeCompare(b.name));$('thead').innerHTML='<tr><th>Categoria</th><th>Participante</th><th>Estética + Simpatia</th><th>Comunicação + Elegância</th><th>Samba no Pé</th><th>Total parcial/final</th><th>Avaliações completas</th><th>Status / título</th></tr>';$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${fmt(x.aesthetics_sympathy)}</td><td>${fmt(x.communication_elegance)}</td><td>${fmt(x.samba)}</td><td><b>${fmt(x.total)}</b></td><td>${x.complete_evaluators||0}/5</td><td>${esc(x.title||(x.status==='Parcial'?'Parcial — provisório':x.status||'Aguardando notas'))}</td></tr>`).join('')||'<tr><td colspan="8">Ainda não há resultados do Concurso.</td></tr>';$('summary').innerHTML=`<div>Participantes classificados da Audição <b>${rows.length}</b></div><div>Apurações completas <b>${rows.filter(x=>x.complete).length}</b></div><div>Parciais <b>${rows.filter(x=>x.complete_evaluators>0&&!x.complete).length}</b></div>`;$('explain').textContent='Concurso: os participantes elegíveis vêm da Audição; as notas do Concurso são independentes. Passistas não recebem critério Estética Corporal + Simpatia.';}$('status').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR')+'.'}catch(e){$('status').textContent='Falha ao carregar: '+e.message}}
$('stage').addEventListener('change',load);$('refresh').addEventListener('click',load);$('report').addEventListener('click',()=>window.print());$('sambaTie').addEventListener('change',load);$('commTie').addEventListener('change',load);load();
</script></body></html>
