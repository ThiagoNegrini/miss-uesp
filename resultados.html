<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados — MISS UESP 2027</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#302329}header{padding:18px;border-bottom:5px solid #c8102e}h1,h2{color:#c8102e}main{max-width:1200px;margin:20px auto;padding:0 12px}.card{border:1px solid #e5b7be;border-radius:12px;padding:15px;margin-bottom:14px}select,button{padding:10px;border:1px solid #c8102e;border-radius:8px;color:#a50d25;background:white;font-weight:700;cursor:pointer}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#c8102e;color:white}td,th{padding:9px;border-bottom:1px solid #e5b7be;text-align:left}.note{font-size:13px;color:#5b4a4d}.summary{display:flex;gap:14px;flex-wrap:wrap}.summary b{color:#c8102e;font-size:22px}@media print{body.printing>*:not(#printReport){display:none!important}#printReport{display:block!important;color:#302329;font-family:Arial,sans-serif;padding:12mm}#printReport header{border-bottom:4px solid #c8102e;padding:0 0 8px}#printReport h1,#printReport h2{color:#c8102e}#printReport .legend{font-size:12px;background:#f8edf0;padding:10px}#printReport .person{break-inside:avoid;margin:16px 0;border:1px solid #e5b7be;padding:10px;border-radius:8px}#printReport h3{margin:0 0 4px}#printReport small{font-weight:normal}#printReport .statusline{font-size:12px;font-weight:bold}#printReport table{width:100%;border-collapse:collapse;font-size:10px}#printReport th{background:#c8102e!important;color:white!important;print-color-adjust:exact}#printReport td,#printReport th{border:1px solid #d9c5c8;padding:5px}}#printReport{display:none}</style></head><body><header><h1>Resultados — MISS UESP • CARNAVAL 2027</h1><div>Central de apuração • Audição e Concurso</div></header><main><section class="card"><label for="stage"><b>Etapa dos resultados:</b></label> <select id="stage"><option value="AUDICAO">AUDIÇÃO</option><option value="CONCURSO">CONCURSO</option></select> <button id="refresh">Atualizar resultados</button> <button id="report">Gerar relatório detalhado — etapa selecionada</button><p id="status" class="note">Carregando…</p><div class="summary" id="summary"></div></section><section class="card"><h2 id="heading">Classificação</h2><div class="wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div><p class="note" id="explain"></p></section><section class="card" id="tie" style="display:none"><h2>Critérios de desempate do Concurso</h2><label><input type="checkbox" id="sambaTie" checked> Prioridade 1 — Samba no Pé</label><br><label><input type="checkbox" id="commTie" checked> Prioridade 2 — Comunicação + Elegância</label><p class="note">As opções ordenam os critérios de desempate na tela. Os dados registrados não são alterados.</p></section></main><script>
const $=id=>document.getElementById(id);const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v==null||v===''?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
async function api(path){const r=await fetch(path,{cache:'no-store'});const type=r.headers.get('content-type')||'';if(!type.includes('application/json')){const body=(await r.text()).slice(0,160).replace(/\\s+/g,' ');throw Error('A rota '+path+' retornou '+(type||'conteúdo não JSON')+' (HTTP '+r.status+'). '+body)}let j;try{j=await r.json()}catch(e){throw Error('Resposta JSON inválida da rota '+path)}if(!r.ok||j.ok===false)throw Error(j.error||'Erro API (HTTP '+r.status+')');return j}
let syncingStage=false;
async function syncActiveStage(refresh=true){try{const data=await api('/api/active-stage');const active=String(data.stage||'AUDICAO').toUpperCase()==='CONCURSO'?'CONCURSO':'AUDICAO';if($('stage').value!==active){syncingStage=true;$('stage').value=active;syncingStage=false;if(refresh)await load();}return active}catch(e){$('status').textContent='Não foi possível sincronizar a etapa com a Central: '+e.message;return null}}
async function load(){const stage=$('stage').value;$('status').textContent='Consultando etapa '+stage+'…';$('tie').style.display=stage==='CONCURSO'?'block':'none';try{if(stage==='AUDICAO'){const [cr,ar,sr]=await Promise.all([api('/api/candidates'),api('/api/arrivals'),api('/api/scores')]);const arrivals=ar.arrivals||{},scores=sr.scores||{};let rows=(cr.candidates||[]).filter(c=>arrivals[String(c.id)]&&String(arrivals[String(c.id)].status||'PRESENTE')==='PRESENTE').map(c=>{const ev=Object.values(scores[String(c.id)]||{}).filter(s=>s&&s.communication!=null&&s.samba!=null);return {...c,count:ev.length,total:ev.reduce((n,s)=>n+Number(s.communication)+Number(s.samba),0),samba:ev.reduce((n,s)=>n+Number(s.samba),0)}});rows.sort((a,b)=>norm(a.category).localeCompare(norm(b.category))||b.total-a.total||b.samba-a.samba||a.name.localeCompare(b.name));$('thead').innerHTML='<tr><th>Categoria</th><th>Candidata(o)</th><th>Avaliações completas</th><th>Total acumulado</th><th>Samba (desempate)</th><th>Status</th></tr>';$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.count}/5</td><td>${x.count?fmt(x.total):'—'}</td><td>${x.count?fmt(x.samba):'—'}</td><td>${x.count>=5?'Completa':x.count?'Parcial':'Aguardando notas'}</td></tr>`).join('')||'<tr><td colspan="6">Sem participantes presentes.</td></tr>';$('summary').innerHTML=`<div>Candidatos presentes <b>${rows.length}</b></div><div>Apurações completas <b>${rows.filter(x=>x.count>=5).length}</b></div><div>Parciais <b>${rows.filter(x=>x.count>0&&x.count<5).length}</b></div>`;$('explain').textContent='Audição: a pontuação soma Comunicação e Samba por avaliador com os dois critérios válidos. Classificação e notas da etapa Concurso são mantidas separadamente.';}else{const [j,roster]=await Promise.all([api('/api/contest-results'),api('/api/evaluators?stage=CONCURSO')]);const expectedEvaluators=(roster.evaluators||[]).length;let rows=j.results||[];const order=[];if($('sambaTie').checked)order.push('samba');if($('commTie').checked)order.push('communication_elegance');rows.sort((a,b)=>norm(a.category).localeCompare(norm(b.category))||Number(b.total??-1)-Number(a.total??-1)||order.reduce((d,k)=>d||(Number(b[k]??-1)-Number(a[k]??-1)),0)||a.name.localeCompare(b.name));$('thead').innerHTML='<tr><th>Categoria</th><th>Participante</th><th>Estética + Simpatia</th><th>Comunicação + Elegância</th><th>Samba no Pé</th><th>Total parcial/final</th><th>Avaliações completas</th><th>Status / título</th></tr>';$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${fmt(x.aesthetics_sympathy)}</td><td>${fmt(x.communication_elegance)}</td><td>${fmt(x.samba)}</td><td><b>${fmt(x.total)}</b></td><td>${x.complete_evaluators||0}/${x.expected_evaluators??expectedEvaluators}</td><td>${esc(x.title||(x.status==='Parcial'?'Parcial — provisório':x.status||'Aguardando notas'))}</td></tr>`).join('')||'<tr><td colspan="8">Ainda não há resultados do Concurso.</td></tr>';$('summary').innerHTML=`<div>Participantes classificados da Audição <b>${rows.length}</b></div><div>Apurações completas <b>${rows.filter(x=>x.complete).length}</b></div><div>Parciais <b>${rows.filter(x=>x.complete_evaluators>0&&!x.complete).length}</b></div>`;$('explain').textContent=expectedEvaluators===0?'Concurso: nenhum avaliador cadastrado na Central. Cadastre os nomes para que a apuração possa ser finalizada. Passistas não recebem critério Estética Corporal + Simpatia.':'Concurso: '+expectedEvaluators+' avaliador(es) cadastrado(s) na Central. A apuração só é finalizada quando cada participante tiver '+expectedEvaluators+' avaliações completas. Passistas não recebem critério Estética Corporal + Simpatia.';}$('status').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR')+'.'}catch(e){$('status').textContent='Falha ao carregar: '+e.message}}
$('stage').addEventListener('change',load);$('refresh').addEventListener('click',load);$('report').addEventListener('click',generateReport);
async function generateReport(){
 const reportTab=window.open('about:blank','_blank');
 if(!reportTab){$('status').textContent='Permita pop-ups para abrir o relatório em uma nova aba.';return;}
 const stage=$('stage').value;
 $('status').textContent='Preparando relatório detalhado…';
 try{
  let heading, candidates, scoreMap, evaluators, criterionKeys, criterionLabels;
  if(stage==='AUDICAO'){
   const [c,a,s,e]=await Promise.all([api('/api/candidates'),api('/api/arrivals'),api('/api/scores'),api('/api/evaluators?stage=AUDICAO')]);
   const arrivals=a.arrivals||{};
   candidates=(c.candidates||[]).filter(x=>arrivals[String(x.id)]&&String(arrivals[String(x.id)].status||'PRESENTE')==='PRESENTE');
   scoreMap=s.scores||{}; evaluators=e.evaluators||[];
   criterionKeys=['communication','samba'];criterionLabels=['Comunicação','Samba no Pé'];heading='Relatório detalhado — Audição';
  }else{
   const [c,e]=await Promise.all([api('/api/contest-report-data'),api('/api/evaluators?stage=CONCURSO')]);
   candidates=c.candidates||[];scoreMap=c.scores||{};evaluators=e.evaluators||[];
   criterionKeys=['aesthetics_sympathy','communication_elegance','samba'];criterionLabels=['Estética Corporal + Simpatia','Comunicação e Elegância','Samba no Pé'];heading='Relatório detalhado — Concurso';
  }
  const criteriaFor=x=>stage==='AUDICAO'?criterionKeys:(norm(x.category).includes('passista')?criterionKeys.slice(1):criterionKeys);
  const escHtml=esc;
  const sorted=[...candidates].sort((a,b)=>norm(a.category).localeCompare(norm(b.category))||norm(a.name).localeCompare(norm(b.name)));
  const cards=sorted.map(c=>{
   const applicable=criteriaFor(c), entries=scoreMap[String(c.id)]||{};
   const done=evaluators.filter(ev=>entries[ev]&&applicable.every(k=>entries[ev][k]!=null));
   const incomplete=evaluators.filter(ev=>entries[ev]&&applicable.some(k=>entries[ev][k]!=null)&&!applicable.every(k=>entries[ev][k]!=null));
   const state=done.length===evaluators.length&&evaluators.length>0?'Completa ('+done.length+'/'+evaluators.length+')':done.length?'Parcial — '+done.length+'/'+evaluators.length+' avaliações completas':'Aguardando notas';
   const total=done.reduce((sum,ev)=>sum+applicable.reduce((n,k)=>n+Number(entries[ev][k]||0),0),0);
   const rows=evaluators.map(ev=>{
    const v=entries[ev]||{};
    const any=applicable.some(k=>v[k]!=null);
    const evComplete=applicable.every(k=>v[k]!=null);
    return '<tr><td>'+escHtml(ev)+'</td>'+applicable.map(k=>'<td>'+ (v[k]!=null?fmt(v[k]):'—')+'</td>').join('')+'<td>'+ (evComplete?fmt(applicable.reduce((n,k)=>n+Number(v[k]||0),0)):'—')+'</td><td>'+ (evComplete?'Completa':any?'Incompleta':'Sem registro')+'</td></tr>';
   }).join('');
   return '<article class="person"><div class="identity">'+(c.photo?'<img class="photo" src="'+escHtml(c.photo)+'" alt="Foto de '+escHtml(c.name)+'">':'<div class="photo missing">Foto não cadastrada</div>')+'<div><h3>'+escHtml(c.name)+' <small>('+escHtml(c.category)+')</small></h3>'+(c.artistic_name?'<p class="artname">Nome artístico: <strong>'+escHtml(c.artistic_name)+'</strong></p>':'<p class="artname">Nome artístico: —</p>')+'<p class="statusline">'+state+(incomplete.length?' · '+incomplete.length+' avaliação(ões) com critério(s) faltando':'')+'</p></div></div><table><thead><tr><th>Avaliador(a)</th>'+applicable.map(k=>'<th>'+escHtml(criterionLabels[criterionKeys.indexOf(k)])+'</th>').join('')+'<th>Total da avaliação</th><th>Status da avaliação</th></tr></thead><tbody>'+rows+'</tbody></table><p class="totalparticipant">Total acumulado das avaliações completas: <strong>'+fmt(total)+'</strong></p></article>';
  }).join('');
  const doc='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+heading+'</title><style>\n*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#302329;margin:0;padding:18px}header{border-bottom:5px solid #c8102e;padding:0 0 10px}h1,h2{color:#c8102e;margin:4px 0}h1{font-size:24px}h2{font-size:20px}.legend{font-size:12px;background:#f8edf0;padding:10px}.person{break-inside:avoid;margin:16px 0;border:1px solid #e5b7be;padding:10px;border-radius:8px}.identity{display:flex;gap:12px;align-items:center;margin-bottom:8px}.photo{width:90px;height:110px;object-fit:cover;border:1px solid #d9c5c8;border-radius:5px}.photo.missing{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#766; padding:6px}h3{margin:0 0 4px;font-size:16px}small{font-weight:normal}.artname{margin:3px 0;font-size:13px}.statusline{font-size:12px;font-weight:bold;margin:5px 0}.totalparticipant{font-size:13px;text-align:right;background:#f8edf0;padding:8px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#c8102e;color:white;print-color-adjust:exact}td,th{border:1px solid #d9c5c8;padding:5px;text-align:left}@media print{body{padding:10mm}button{display:none}}</style></head><body><header><h1>MISS UESP • CARNAVAL 2027</h1><h2>'+heading+'</h2><p>Emitido em '+new Date().toLocaleString('pt-BR')+' · Notas registradas até este momento</p></header><p class="legend">Relatório de acompanhamento. Uma avaliação só é considerada completa quando todos os critérios aplicáveis estão preenchidos. Notas parciais não representam resultado final.</p>'+cards+'<p><button onclick="window.print()">Imprimir / Salvar PDF</button></p></body></html>';
  reportTab.document.open();reportTab.document.write(doc);reportTab.document.close();
  $('status').textContent='Relatório preparado.';
 }catch(err){$('status').textContent='Não foi possível gerar relatório: '+err.message}
}$('stage').addEventListener('change',()=>{if(!syncingStage)load()});
$('sambaTie').addEventListener('change',load);$('commTie').addEventListener('change',load);
(async()=>{await syncActiveStage(false);await load();setInterval(()=>syncActiveStage(true),3000);window.addEventListener('focus',()=>syncActiveStage(true));})();
</script></body></html>
